[workspace]
members = ["bevy_caaqi"]

[package]
name = "caaqi"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
bevy_vello.workspace = true
env_logger = "0.11.11"
bevy_caaqi = { package = "bevy_caaqi", path = "bevy_caaqi" }

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
bevy_vello = "0.14.0"


[features]
hotpatching = ["bevy/hotpatching"]
debug = ["bevy/debug"]
